openapi: 3.0.3
info:
  title: Enterprise Funds Transfer API
  version: 1.0.2
  description: |
    V1 scope: internal, same-currency account-to-account transfers only.
    No external settlement, no FX.

    **Status: APPROVED v1.0 (2026-09-18), Milestone 1 exit gate passed.**
    Amendment A1 (v1.0.1): limit enforcement made concurrency-safe; validation
    step 9 clarified. No status code, error code or field changed.
    Amendment A2 (v1.0.2): idempotency strengthened. New 409 code
    `IDEMPOTENCY_KEY_EXPIRED`; `Location` may accompany it; replayed error bodies
    carry the current `correlationId`. No existing behaviour was removed.
    Layout: this root file composes the domain specs `identity/`, `accounts/`,
    `transfers/` (shared types in `common/`). Each is a valid OpenAPI document
    on its own; the domain files are the source of truth, this file only wires
    them together. `scripts/openapi.sh bundle` produces one flattened file.
    Companion document: `docs/milestone-1-contract.md` (authorization matrix,
    state-transition table, domain relationships, open decisions).

    Cross-cutting rules
    - Identity comes from the verified bearer token. No endpoint accepts a
      client-supplied user ID.
    - All monetary amounts are decimal strings, never JSON numbers, so no
      binary floating point is involved anywhere on the wire.
    - Every response, success or error, carries `X-Correlation-Id`. It echoes
      a valid inbound value or is generated by the server. Error bodies repeat
      it in `correlationId`. A lint rule fails the build if any response omits it.
    - Other response headers are documented once, as components, and only where
      they apply: `Location` (201 create), `Idempotent-Replayed` (201 or 422 when
      a stored outcome is replayed), `Retry-After` (409 `IDEMPOTENCY_IN_PROGRESS`
      only), `Location` (also 409 `IDEMPOTENCY_KEY_EXPIRED` when a transfer exists). No response documents a header it does not send.
    - Internal risk details, stack traces and secrets are never exposed.
    - Resources the caller may not access return 404, not 403, so account and
      transfer existence is not disclosed. 403 is reserved for a
      recognised resource where the caller's role lacks the operation.
    - Error `code` values are a closed set (`ErrorCode`); clients switch on
      `code`, never on `message`.

    Posting model (approved, decision D1)
    - Posting is synchronous. `POST /transfers` validates, posts and commits
      in one database transaction, then responds. The `status` in the
      response is the state reached when the request finished: `COMPLETED`,
      or `PENDING_REVIEW` when the risk decision requires manual review.
    - `RECEIVED`, `VALIDATING` and `PROCESSING` are internal transient
      states. Clients only see them after a crash/recovery window, so
      clients must treat any non-terminal status as "poll with GET".

    Timeouts and retries (placeholder values, decision D3)
    - Server request deadline 10 s; database lock-wait 5 s. Exceeding either
      returns 500 `INTERNAL_ERROR` and the transaction is rolled back.
    - Client guidance: set a client timeout above the server deadline
      (>= 15 s). On a timeout, network error or 500, retry `POST /transfers`
      with the **same** `Idempotency-Key` and identical body. This can never
      double-post.
    - GET endpoints and `cancel` are safe to retry.
    - Event delivery to Kafka is at-least-once. Consumers must deduplicate
      on the event ID.
servers:
  - url: /api/v1
security:
  - bearerAuth: []

tags:
  - name: transfers
    description: Transfer lifecycle. Spec `transfers/transfers-v1.yaml`.
  - name: accounts
    description: Account balance and history. Spec `accounts/accounts-v1.yaml`.
  - name: identity
    description: No endpoints in V1; defines authentication and roles. Spec `identity/identity-v1.yaml`.

paths:
  /transfers:
    $ref: 'transfers/transfers-v1.yaml#/paths/~1transfers'
  /transfers/{transferId}:
    $ref: 'transfers/transfers-v1.yaml#/paths/~1transfers~1{transferId}'
  /transfers/{transferId}/cancel:
    $ref: 'transfers/transfers-v1.yaml#/paths/~1transfers~1{transferId}~1cancel'
  /accounts/{accountId}/balance:
    $ref: 'accounts/accounts-v1.yaml#/paths/~1accounts~1{accountId}~1balance'
  /accounts/{accountId}/transfers:
    $ref: 'accounts/accounts-v1.yaml#/paths/~1accounts~1{accountId}~1transfers'

components:
  securitySchemes:
    bearerAuth:
      $ref: 'identity/identity-v1.yaml#/components/securitySchemes/bearerAuth'
